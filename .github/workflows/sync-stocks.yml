name: Sync BIST stocks

# KAP'tan güncel hisse listesini alır ve DB'de olmayanları ekler. Mevcut hisseler silinmez.
# v2'de otomatik tamamlama DB'den okunur; repoya dosya yazılmaz, bu yüzden yazma izni gerekmez.
on:
  schedule:
    - cron: '17 5 * * 1' # Pazartesi 08:17 (TR)
  workflow_dispatch:
    inputs:
      apply:
        description: "DB'ye yaz (kapalıysa sadece rapor)"
        type: boolean
        default: false
      max_new:
        description: 'Tek seferde eklenebilecek en fazla hisse (ilk toplu senkronizasyon için artır)'
        type: number
        default: 15

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: tee hatayı gizlemesin

concurrency:
  group: sync-stocks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
      MAX_NEW: ${{ inputs.max_new || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - name: Fetch stock list from KAP
        run: node scripts/fetch-kap-stocks.mjs > kap-stocks.csv

      - name: Sync to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node scripts/sync-stocks.mjs kap-stocks.csv --max-new="$MAX_NEW" $([ "$APPLY" = "true" ] && echo --apply) 2>&1 | tee sync-report.txt
          { echo '```'; cat sync-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Autocomplete hisse indeksi 24 saat önbellekli (S7): yeni hisseler hemen görünsün.
      # Secret/URL tanımlı değilse adım atlanır; indeks yine en geç 24 saatte tazelenir.
      - name: Revalidate autocomplete stock index
        if: env.APPLY == 'true'
        env:
          STOCKS_REVALIDATE_SECRET: ${{ secrets.STOCKS_REVALIDATE_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$STOCKS_REVALIDATE_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "STOCKS_REVALIDATE_SECRET ya da SITE_URL tanımlı değil; atlandı."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer $STOCKS_REVALIDATE_SECRET" \
            "$SITE_URL/api/revalidate/stocks"
