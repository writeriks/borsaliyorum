name: Sync BIST stocks

# KAP'tan güncel hisse listesini alır, DB'de olmayanları ekler ve
# src/tickers.ts güncellemesini chore/sync-stocks branch'ine push'lar. Mevcut hisseler silinmez.
on:
  schedule:
    - cron: '17 5 * * 1' # Pazartesi 08:17 (TR)
  workflow_dispatch:
    inputs:
      apply:
        description: "DB'ye yaz ve PR aç (kapalıysa sadece rapor)"
        type: boolean
        default: false
      max_new:
        description: 'Tek seferde eklenebilecek en fazla hisse (ilk toplu senkronizasyon için artır)'
        type: number
        default: 15

permissions:
  contents: write

defaults:
  run:
    shell: bash # -eo pipefail: tee hatayı gizlemesin

concurrency:
  group: sync-stocks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
      MAX_NEW: ${{ inputs.max_new || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - name: Fetch stock list from KAP
        run: node scripts/fetch-kap-stocks.mjs > kap-stocks.csv

      - name: Sync to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node scripts/sync-stocks.mjs kap-stocks.csv --max-new="$MAX_NEW" $([ "$APPLY" = "true" ] && echo --apply) 2>&1 | tee sync-report.txt
          { echo '```'; cat sync-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN ile açılan PR'da CI tetiklenmez; üretilen dosyayı burada doğrula
      - name: Type-check generated tickers.ts
        if: env.APPLY == 'true'
        run: npx tsc --noEmit -p .

      # PR açma izni gerektirmesin diye sadece branch push'lanır; PR'ı elle açılır
      - name: Push tickers.ts to a branch
        if: env.APPLY == 'true'
        run: |
          git diff --quiet src/tickers.ts && { echo "tickers.ts değişmedi."; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b chore/sync-stocks
          git commit -m 'chore: sync BIST stock list from KAP' src/tickers.ts
          git push --force origin chore/sync-stocks
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...chore/sync-stocks?expand=1"
          echo "PR açmak için: $url" | tee -a "$GITHUB_STEP_SUMMARY"
