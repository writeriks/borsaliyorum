name: KAP probe (temporary)

on:
  push:
    branches: [claude/rebuild-agents-skills]
    paths: [.github/workflows/kap-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect KAP market grouping
        shell: python
        run: |
          import re, urllib.request, base64
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=60).read().decode('utf-8')
          code = base64.b64encode('YILDIZ PAZAR'.encode()).decode().rstrip('=')
          p = get('https://www.kap.org.tr/tr/Pazarlar?market=' + code).replace('\\"', '"')
          for name in ['YILDIZ PAZAR', 'ANA PAZAR', 'ALT PAZAR', 'YAKIN İZLEME PAZARI', 'KESİN ALIM SATIM PAZARI', 'GİRİŞİM SERMAYESİ PAZARI']:
              hits = [m.start() for m in re.finditer(re.escape('"' + name + '"'), p)]
              print('=====', name, 'occurrences', len(hits))
              for h in hits[:3]:
                  print(repr(p[max(0, h - 250): h + 350]))
          first = p.find('"stockCode"')
          print('=== before first stockCode'); print(repr(p[max(0, first - 800): first + 100]))
