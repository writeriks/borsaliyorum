name: KAP probe (temporary)

on:
  push:
    branches: [claude/rebuild-agents-skills]
    paths: [.github/workflows/kap-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch KAP BIST company list page
        run: |
          set -x
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          curl -sSL -A "$UA" -o page.html -w '%{http_code} %{content_type} %{size_download}\n' https://www.kap.org.tr/tr/bist-sirketler || true
          head -c 1500 page.html; echo
          grep -o '__NEXT_DATA__' page.html | head -1 || true
          grep -oE '/tr/api/[A-Za-z0-9_/.-]+' page.html | sort -u | head -40 || true
          grep -oE '"(stockCode|memberCode|kapMemberTitle|title|code)"' page.html | sort | uniq -c | head -20 || true
          grep -oE '[A-Z0-9]{4,6}' page.html | grep -E '^(THYAO|ASELS|ACSEL|GARAN)$' | sort | uniq -c || true
          grep -o 'THYAO.\{0,300\}' page.html | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: kap-page
          path: page.html
