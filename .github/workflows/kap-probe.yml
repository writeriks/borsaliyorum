name: KAP probe (temporary)

on:
  push:
    branches: [claude/rebuild-agents-skills]
    paths: [.github/workflows/kap-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect KAP company summary pages
        shell: python
        run: |
          import re, urllib.request
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=60).read().decode('utf-8')
          for slug in ['1107-turk-hava-yollari-a-o', '1500-turk-altin-isletmeleri-a-s']:
              h = get('https://www.kap.org.tr/tr/sirket-bilgileri/ozet/' + slug)
              t = re.sub(r'<[^>]+>', ' ', h.replace('\\"', '"'))
              t = re.sub(r'\s+', ' ', t)
              print('=====', slug, len(h))
              for kw in ['Pazar', 'pazar', 'Endeks', 'market', 'Market']:
                  for m in list(re.finditer(kw, t))[:4]:
                      print(kw, '>>', t[max(0, m.start() - 150): m.start() + 200])
          # bond-only issuer: find KOCFN slug from list page
          lst = get('https://www.kap.org.tr/tr/bist-sirketler')
          m = re.search(r'/tr/sirket-bilgileri/ozet/([^"]+)"><div>KOCFN<', lst)
          print('KOCFN slug', m and m.group(1))
          if m:
              h = get('https://www.kap.org.tr/tr/sirket-bilgileri/ozet/' + m.group(1))
              t = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', h.replace('\\"', '"')))
              for kw in ['Pazar', 'pazar', 'Endeks', 'market', 'Market']:
                  for mm in list(re.finditer(kw, t))[:4]:
                      print('KOCFN', kw, '>>', t[max(0, mm.start() - 150): mm.start() + 200])
