name: KAP probe (temporary)

on:
  push:
    branches: [claude/rebuild-agents-skills]
    paths: [.github/workflows/kap-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect KAP JSON objects
        shell: python
        run: |
          import re, urllib.request, collections
          req = urllib.request.Request('https://www.kap.org.tr/tr/bist-sirketler', headers={'User-Agent': 'Mozilla/5.0'})
          html = urllib.request.urlopen(req, timeout=60).read().decode('utf-8')
          t = html.replace('\\"', '"')
          objs = re.findall(r'\{[^{}]{0,2000}?"kapMemberType":"[A-Z]+"[^{}]{0,500}\}', t)
          print('objects', len(objs))
          print('types', collections.Counter(re.findall(r'"kapMemberType":"([A-Z]+)"', t)))
          keys = collections.Counter(k for o in objs for k in re.findall(r'"([A-Za-z]+)":', o))
          print('keys', keys.most_common(30))
          for c in ['THYAO', 'GARAN', 'ISFAK', 'A1CAP', 'KOCFN']:
              hit = [o for o in objs if re.search(r'"' + c + r'[",]| ' + c + r'[",]', o)]
              print('===', c, len(hit))
              for o in hit[:2]: print(o[:900])
          i = html.find('>THYAO<')
          print('=== row html'); print(html[max(0, i - 900): i + 900])
