name: KAP probe (temporary)

on:
  push:
    branches: [claude/rebuild-agents-skills]
    paths: [.github/workflows/kap-probe.yml, scripts/fetch-kap-stocks.mjs]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse KAP equity list and compare with tickers.ts
        run: |
          node scripts/fetch-kap-stocks.mjs > kap.csv
          wc -l < kap.csv; head -3 kap.csv
          grep -oE "'id': '[A-Z0-9]+'" src/tickers.ts | cut -d"'" -f4 | sort > old.txt
          cut -d';' -f1 kap.csv | sort > new.txt
          echo "--- NEW: $(comm -13 old.txt new.txt | wc -l)"; comm -13 old.txt new.txt | while read c; do grep "^$c;" kap.csv; done
          echo "--- GONE: $(comm -23 old.txt new.txt | wc -l)"; comm -23 old.txt new.txt | tr '\n' ' '; echo
