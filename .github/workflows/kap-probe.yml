name: KAP probe (temporary)

on:
  push:
    branches: [claude/rebuild-agents-skills]
    paths: [.github/workflows/kap-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect KAP JSON objects
        run: |
          curl -sSL -A 'Mozilla/5.0' -o page.html https://www.kap.org.tr/tr/bist-sirketler
          sed 's/\\"/"/g' page.html > p.txt
          for c in THYAO GARAN ISFAK TIB A1CAP; do
            echo "=== $c"; grep -o '{[^{}]*"[A-Za-z]*":"[^"]*\b'"$c"'\b[^{}]*}' p.txt | head -2 | cut -c1-700
          done
          echo "=== keys"; grep -oE '"[a-zA-Z]+":' p.txt | sort | uniq -c | sort -rn | head -40
          echo "=== memberTypes"; grep -oE '"kapMemberType":"[A-Z]+"' p.txt | sort | uniq -c
          echo "=== first td row html"; grep -o '<tr[^>]*>.\{0,1200\}THYAO.\{0,600\}' page.html | head -1
