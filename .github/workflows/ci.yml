name: CI

# Çift koşuyu önlemek için: main ve agent dalları (claude/**) push'ta koşar; diğer dallar
# PR açılınca. claude/** dalından açılan PR'da push koşusu zaten aynı commit'i test ettiği
# için pull_request koşusundaki job'lar atlanır (aşağıdaki `if`).
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # main'de her commit sonuna kadar test edilir; dallarda yeni push eskisini iptal eder
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

defaults:
  run:
    shell: bash

jobs:
  type-check:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run type-check

  lint:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  unit:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Gerçek Postgres ile migration kapısı + DAL testleri (ADR-0003 Karar 3, Karar 5).
  # Gerçek secret kullanılmaz; DB yalnızca bu job'un service container'ı.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Neon prod ana sürümüyle aynı olmalı (ADR-0003; doğrulanınca güncellenir)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['54329:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # postinstall → prisma generate
      - run: npm ci
      - run: npm run db:migrations:check
      - run: npm run test:integration

  build:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI gerçek secret kullanmaz (ADR-0003); Vercel'de bu bayrak yok sayılır
      SKIP_ENV_VALIDATION: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run build

  # Firebase Auth emulator (demo- projesi, npx firebase-tools) + gerçek Postgres; gerçek secret yok
  e2e:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['54329:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Auth emulator Node ile çalışır; firebase-tools'un Java kontrolüne takılmamak için sabit JDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # webServer: emulator (npm run emulators) + build:e2e (SKIP_ENV_VALIDATION=1) + start:e2e;
      # globalSetup E2E veritabanını migration'larla kurar
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
